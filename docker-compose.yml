version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: slicktrace-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: slicktrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: slicktrace-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=True
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/slicktrace_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./reports:/app/reports

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: slicktrace-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgis_data:
