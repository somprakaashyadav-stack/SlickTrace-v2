services:
  - type: web
    name: slicktrace-backend
    env: python
    rootDir: slicktrace/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///slicktrace.db
