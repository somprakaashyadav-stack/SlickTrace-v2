services:
  - type: web
    name: slicktrace-v2-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: true
      - key: DATABASE_URL
        value: sqlite:///./slicktrace.db
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
